# Workspace root: holds the shared tooling config. The Python code lives in the members.
[project]
name = "bundespredict-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "bundespredict[model,agent]",
    "bundespredict-api",
    "bundespredict-backend",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "testcontainers[postgres]>=4.0",
    "pytest-django>=4.9",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/model", "apps/api", "apps/backend"]

[tool.uv.sources]
bundespredict = { workspace = true }
bundespredict-api = { workspace = true }
bundespredict-backend = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/model/src", "apps/api", "apps/backend", "tests"]
# Exploratory notebooks follow notebook idioms (per-cell imports, %magics) that
# clash with the strict lint rules; they aren't part of the app surface.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/model/src", "apps/api", "apps/backend", "tests"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "apps/backend"

[[tool.mypy.overrides]]
# These ship no type stubs (scipy/sklearn, django-environ) or none we want to depend on, or are
# optional extras that CI does not install (playwright for the Understat scrape, matplotlib for
# the backtest report).
module = ["testcontainers.*", "scipy.*", "sklearn.*", "environ.*", "playwright.*", "matplotlib.*", "allauth.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
testpaths = ["tests", "apps/backend/tests"]
addopts = "-q --import-mode=importlib"
pythonpath = [".", "apps/api", "apps/backend"]
DJANGO_SETTINGS_MODULE = "config.settings.test"
