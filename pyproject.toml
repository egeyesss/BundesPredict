# Workspace root: holds the shared tooling config. The Python code lives in the members.
[project]
name = "bundespredict-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "bundespredict[model,agent]",
    "bundespredict-api",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "testcontainers[postgres]>=4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/model", "apps/api"]

[tool.uv.sources]
bundespredict = { workspace = true }
bundespredict-api = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/model/src", "apps/api", "tests"]
# Exploratory notebooks follow notebook idioms (per-cell imports, %magics) that
# clash with the strict lint rules; they aren't part of the app surface.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/model/src", "apps/api", "tests"]

[[tool.mypy.overrides]]
# These ship no type stubs (scipy/sklearn) or none we want to depend on.
module = ["testcontainers.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["apps/api"]
