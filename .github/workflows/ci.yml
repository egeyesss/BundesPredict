name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        # One lockfile for the whole workspace: the model library, the FastAPI app
        # and the Django backend, plus the dev tools.
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run --no-sync ruff check .
      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .
      - name: Types (mypy)
        run: uv run --no-sync mypy
      - name: Tests (pytest)
        run: uv run --no-sync pytest
      - name: OpenAPI schema is fresh
        # Placeholder until apps/backend/openapi.json is committed; it will regenerate
        # the schema here and fail on a diff.
        run: "true"

  web:
    runs-on: ubuntu-latest
    # Same image the local `npm run e2e` uses, so screenshot baselines match.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the styleguide is not in the production build
        run: npm run check:production-routes
      - name: E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
