name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        # One lockfile for the whole workspace: the model library and the Django backend,
        # plus the dev tools.
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run --no-sync ruff check .
      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .
      - name: Types (mypy)
        run: uv run --no-sync mypy
      - name: Tests (pytest)
        run: uv run --no-sync pytest
      - name: OpenAPI schema is fresh
        # Regenerates the committed schema, which also fails on any spectacular warning, and
        # then fails if that changed the file. Test settings need no secrets or database.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          uv run --no-sync apps/backend/manage.py spectacular --format openapi-json \
            --validate --fail-on-warn --file apps/backend/openapi.json
          git diff --exit-code apps/backend/openapi.json

  web:
    runs-on: ubuntu-latest
    # Same image the local `npm run e2e` uses, so screenshot baselines match.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: API types are fresh
        # The container runs as a different user than the checkout, which git refuses without this.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm run api:types
          git diff --exit-code lib/api/schema.d.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the styleguide is not in the production build
        run: npm run check:production-routes
      - name: E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
