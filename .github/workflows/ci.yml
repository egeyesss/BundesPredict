name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        # One lockfile for the whole workspace: the model library, the FastAPI app
        # and the Django backend, plus the dev tools.
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run --no-sync ruff check .
      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .
      - name: Types (mypy)
        run: uv run --no-sync mypy
      - name: Tests (pytest)
        run: uv run --no-sync pytest
      - name: OpenAPI schema is fresh
        # Placeholder until apps/backend/openapi.json is committed; it will regenerate
        # the schema here and fail on a diff.
        run: "true"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
