# Weekly retrain: pull the latest results, refit on the full history, persist a new
# parameter run, and refresh the fixture schedule. Squads and market values are not
# scraped here: Transfermarkt's WAF answers GitHub's runners with a bot challenge, so
# that scrape runs locally and the refit reads whatever squad values the database has.
# Serving reads the newest run on the next request.
# Daily at 05:00 UTC, an hour before snapshot.yml: football-data.co.uk posts a weekend's
# results anywhere from Sunday night to Tuesday, so a weekly run could fit without them.
# A scheduled run always targets production, a manual run targets the chosen database.
name: refit

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      database:
        description: Database to run against
        type: choice
        options:
          - adoption
          - production
        default: adoption

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_CHOICE: ${{ github.event_name == 'schedule' && 'production' || inputs.database }}
      ADOPTION_DATABASE_URL: ${{ secrets.ADOPTION_DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # The commands never sign or serve anything; the prod settings just require values.
      DJANGO_SECRET_KEY: not-used-by-management-commands
      DJANGO_ALLOWED_HOSTS: localhost
      PROXY_SECRET: not-used-by-management-commands
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev --package bundespredict-backend
      - name: Pick the database
        # Each database has its own secret and an empty one fails the run, so a missing
        # adoption secret can never end up writing to production.
        run: |
          case "$DATABASE_CHOICE" in
            adoption) url="$ADOPTION_DATABASE_URL" ;;
            production) url="$PRODUCTION_DATABASE_URL" ;;
            *) echo "::error::unknown database '$DATABASE_CHOICE'"; exit 1 ;;
          esac
          if [ -z "$url" ]; then
            echo "::error::the secret for the $DATABASE_CHOICE database is empty"
            exit 1
          fi
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "Running against the $DATABASE_CHOICE database" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the database is fully migrated
        run: uv run --no-sync apps/backend/manage.py migrate --check
      - name: Refit on the latest results
        run: uv run --no-sync apps/backend/manage.py refit
      - name: Refresh the fixture schedule
        run: uv run --no-sync apps/backend/manage.py download_fixtures
