# Email the coming matchday's odds to opted-in Pro users, Thursdays at 12:00 UTC.
# A scheduled run always targets production, a manual run targets the chosen database.
# Only production gets the Resend key: an adoption run prints the mail instead of sending it,
# so a copy of real addresses is never emailed from a test run.
name: matchday-email

on:
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:
    inputs:
      database:
        description: Database to run against
        type: choice
        options:
          - adoption
          - production
        default: adoption
      recipient:
        description: Send one test copy to this address instead of to every subscriber
        type: string
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_CHOICE: ${{ github.event_name == 'schedule' && 'production' || inputs.database }}
      ADOPTION_DATABASE_URL: ${{ secrets.ADOPTION_DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ (github.event_name == 'schedule' || inputs.database == 'production') && secrets.RESEND_API_KEY || '' }}
      EMAIL_FROM: BundesPredict <bundespredict@egeyesilyurt.ca>
      PUBLIC_SITE_URL: https://bundespredict.egeyesilyurt.ca
      TEST_RECIPIENT: ${{ inputs.recipient }}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: not-serving-requests
      DJANGO_ALLOWED_HOSTS: localhost
      PROXY_SECRET: not-serving-requests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev --package bundespredict-backend
      - name: Pick the database
        # Each database has its own secret and an empty one fails the run, so a missing
        # adoption secret can never end up writing to production.
        run: |
          case "$DATABASE_CHOICE" in
            adoption) url="$ADOPTION_DATABASE_URL" ;;
            production) url="$PRODUCTION_DATABASE_URL" ;;
            *) echo "::error::unknown database '$DATABASE_CHOICE'"; exit 1 ;;
          esac
          if [ -z "$url" ]; then
            echo "::error::the secret for the $DATABASE_CHOICE database is empty"
            exit 1
          fi
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "Running against the $DATABASE_CHOICE database" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the mail key
        # Without the key the production settings fall back to the console mailer, which would
        # record every user as emailed while nothing was delivered.
        run: |
          if [ "$DATABASE_CHOICE" = "production" ] && [ -z "$RESEND_API_KEY" ]; then
            echo "::error::the RESEND_API_KEY secret is empty"
            exit 1
          fi
      - name: Check the database is fully migrated
        run: uv run --no-sync apps/backend/manage.py migrate --check
      - name: Send the matchday email
        run: |
          if [ -n "$TEST_RECIPIENT" ]; then
            uv run --no-sync apps/backend/manage.py send_matchday_email --recipient "$TEST_RECIPIENT"
          else
            uv run --no-sync apps/backend/manage.py send_matchday_email
          fi
