# One-command local stack: Postgres + Django + Next.js.
# Run from the repo root:  docker compose -f infra/docker-compose.yml up --build
# (or add `COMPOSE_FILE=infra/docker-compose.yml` to your .env)

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bundespredict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bundespredict}
      POSTGRES_DB: ${POSTGRES_DB:-bundespredict}
    # Host port is configurable to avoid clashing with a local Postgres on 5432.
    # Containers reach the DB over the internal network as db:5432 regardless.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bundespredict}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # The web container reaches Django as backend:8001, which dev settings do not allow by default.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      PROXY_SECRET: ${PROXY_SECRET:-dev-only-proxy-secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bundespredict}:${POSTGRES_PASSWORD:-bundespredict}@db:5432/${POSTGRES_DB:-bundespredict}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      API_BASE_URL: http://backend:8001
      PROXY_SECRET: ${PROXY_SECRET:-dev-only-proxy-secret}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
