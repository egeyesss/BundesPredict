[project]
name = "bundespredict-backend"
version = "0.0.0"
description = "Django + DRF backend for BundesPredict."
requires-python = ">=3.12"
dependencies = [
    "bundespredict[model,agent]",
    "django>=6.1",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "psycopg[binary,pool]>=3.2",
    "uvicorn[standard]>=0.30",
    "django-allauth[socialaccount]>=65.19.7",
    "django-anymail[resend]>=15.2",
    "stripe>=16.0.0",
]

[tool.uv]
# Run in place (manage.py, uvicorn config.asgi:application); nothing to build.
package = false

[tool.uv.sources]
bundespredict = { workspace = true }
